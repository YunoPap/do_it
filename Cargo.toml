[package]
name = "do_it"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = { version = "0.29.0", features = ["all-widgets"] }
color-eyre = "0.6"
crossterm = "0.27"


# time
chrono = { version = "0.4.44", features = ["serde"] } 
chrono-tz = { version = "0.10.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = { version = "3.0", features = ["chrono_0_4"] }